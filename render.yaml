databases:
  - name: talabahub-db
    plan: free
    databaseName: talabahub
    user: talabahub

services:
  - type: web
    name: talabahub-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn backend.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: talabahub-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://talabahub.vercel.app"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "False"
      - key: FRONTEND_URL
        value: "https://talabahub.vercel.app"
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        value: "https://api.groq.com/openai/v1"
      - key: AI_MODEL
        value: "llama-3.3-70b-versatile"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.smtp.EmailBackend"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.0"
